<!DOCTYPE html>
<html lang="pt-BR">
<head><meta charset="utf-8"><title>OCI AI: Foundations Associate &gt; Alucinação em LLMs | Alura</title></head>
<body>
<section aria-label="Conteúdo da aula">
  <div class="flex flex-col gap-3 py-3">
    <h2 class="font-encode-sans text-2xl leading-normal font-normal text-text-title lg:line-clamp-2">Alucinação em LLMs</h2>
  </div>
  <p class="text-[18px] my-6 text-text-body">O que significa o termo 'alucinação' quando aplicado a um modelo de linguagem (LLM)?</p>
  <p class="font-encode-sans text-sm font-semibold text-text-body">Selecione uma alternativa:</p>
  <ul class="flex flex-col gap-4 my-6">
    <li class="flex flex-col">
      <button type="button" class="grid w-full grid-cols-[5rem_minmax(0,1fr)] overflow-hidden rounded-sm border-0 border-l-8 border-l-brand-default min-h-[140px]" disabled="">
        <div class="bg-task-alternative-sidebar-bg max-w-20 self-stretch min-w-20 flex items-center justify-center p-0">
          <div class="flex items-center justify-center font-encode-sans font-thin text-6xl">A</div>
        </div>
        <div class="bg-task-alternative-content-default-bg min-w-0 p-4 flex items-center">
          <div class="text-task-alternative-content-text w-full min-w-0">
            <p class="text-[18px] my-6 text-text-body">O modelo apresenta erros de gramática e ortografia em suas respostas devido a um treinamento inadequado.</p>
          </div>
        </div>
      </button>
    </li>
    <li class="flex flex-col">
      <button type="button" class="grid w-full grid-cols-[5rem_minmax(0,1fr)] border-0 border-l-8 border-l-brand-default min-h-[140px]" disabled="">
        <div class="bg-task-alternative-sidebar-bg max-w-20 min-w-20 flex items-center justify-center p-0">
          <div class="font-encode-sans font-thin text-6xl">B</div>
        </div>
        <div class="bg-task-alternative-content-default-bg min-w-0 p-4 flex items-center">
          <div class="text-task-alternative-content-text w-full min-w-0">
            <p class="text-[18px] my-6 text-text-body">O modelo está intencionalmente tentando enganar o usuário com informações falsas.</p>
          </div>
        </div>
      </button>
    </li>
    <li class="flex flex-col">
      <button type="button" class="grid w-full grid-cols-[5rem_minmax(0,1fr)] cursor-not-allowed border-0 border-l-8 border-l-feedback-success-default min-h-[140px]" disabled="">
        <div class="bg-task-alternative-correct-sidebar-bg max-w-20 min-w-20 flex items-center justify-center p-0">
          <div class="flex items-center justify-center w-10 h-10">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 23 17" aria-label="Resposta correta"><path stroke="currentColor" d="M22.033.7 7.367 15.367.7 8.7"></path></svg>
          </div>
        </div>
        <div class="bg-task-alternative-correct-content-bg min-w-0 p-4 flex items-center">
          <div class="text-task-alternative-content-text w-full min-w-0">
            <p class="text-[18px] my-6 text-text-body">O modelo gera um texto que não é factual, não tem embasamento ou não faz sentido com a solicitação original.</p>
          </div>
        </div>
      </button>
      <div class="grid grid-cols-[5rem_minmax(0,1fr)] bg-task-alternative-opinion-bg">
        <div class="col-span-2 text-task-alternative-content-text min-w-0 p-6">
          <p class="text-[18px] my-6 text-text-body">Correta, o texto define alucinação como a geração de um texto que não é factual, não tem embasamento, ou é uma invenção sem fundamento em dados reais.</p>
        </div>
      </div>
    </li>
    <li class="flex flex-col">
      <button type="button" class="grid w-full grid-cols-[5rem_minmax(0,1fr)] border-0 border-l-8 border-l-brand-default min-h-[140px]" disabled="">
        <div class="bg-task-alternative-sidebar-bg max-w-20 min-w-20 flex items-center justify-center p-0">
          <div class="font-encode-sans font-thin text-6xl">D</div>
        </div>
        <div class="bg-task-alternative-content-default-bg min-w-0 p-4 flex items-center">
          <div class="text-task-alternative-content-text w-full min-w-0">
            <p class="text-[18px] my-6 text-text-body">O modelo se recusa a fornecer uma resposta, indicando que a pergunta está fora de seu escopo de conhecimento.</p>
          </div>
        </div>
      </button>
    </li>
  </ul>
</section>
</body>
</html>
